[project]
name = "rag-crucible"
version = "0.1.0"
description = "Security, faithfulness, and privacy evaluation platform for RAG pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Haotian (Bob) Bao" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "pypdf>=4.2",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0",
    "transformers>=4.43",
    "torch>=2.3",
]
cohere = ["cohere>=5.5"]
openai = ["httpx>=0.27"]

[project.scripts]
crucible = "crucible.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-beautifulsoup4",
    "fpdf2>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crucible"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
# `›` is the section-path separator used in prompts and CLI output on purpose.
allowed-confusables = ["›"]

[tool.ruff.lint.isort]
known-first-party = ["crucible"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["crucible", "scripts"]

# ML deps are treated as untyped everywhere so type-checking is identical
# with and without the `local` extra installed (CI installs neither).
[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "sentence_transformers.*",
    "transformers.*",
    "torch.*",
    "fpdf.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not local_models'"
markers = [
    "local_models: tests that download/run real local models (run via `make test-local`)",
]

[tool.uv]
package = true
# Always use a uv-managed CPython: system/Anaconda interpreters on macOS are a
# known source of OpenMP/MKL conflicts between faiss and torch (segfaults).
python-preference = "only-managed"
