# Deterministic conformance check only. Fake generation cannot rank prompt
# defenses; use integrity-local.yaml for measured comparisons.
name: integrity-smoke
seed: 42

corpus:
  documents: datasets/seeded/corpus
  qa: datasets/seeded/qa.jsonl

ingest:
  filters: [dedup, language, boilerplate]
  chunker:
    type: fixed
    size_tokens: 350
    overlap_tokens: 60

index:
  store: faiss
  metric: cosine

pipeline:
  embedder:
    provider: fake
    model: hash-64
  retriever:
    k: 20
  reranker:
    provider: fake
    model: overlap
    enabled: true
    top_n: 5
  generator:
    provider: fake
    model: extractive
    temperature: 0.0
    max_tokens: 256

suites:
  security:
    poisoning: {targets: 6}
    injection: {targets: 6}
    defenses:
      - none
      - prompt_isolation
      - injection_filter
      - answer_integrity
