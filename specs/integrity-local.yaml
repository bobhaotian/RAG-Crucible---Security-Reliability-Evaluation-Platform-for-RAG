# Real-model answer-integrity evaluation. Unlike integrity-smoke.yaml, this is
# suitable for comparing defenses because the generator can follow prompts.
name: integrity-local
seed: 42

corpus:
  documents: datasets/seeded/corpus
  qa: datasets/seeded/qa.jsonl

ingest:
  filters: [dedup, language, boilerplate]
  chunker: {type: fixed, size_tokens: 350, overlap_tokens: 60}

index: {store: faiss, metric: cosine}

pipeline:
  embedder: {provider: local, model: sentence-transformers/all-MiniLM-L6-v2}
  retriever: {k: 20}
  reranker:
    provider: local
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    enabled: true
    top_n: 5
  generator:
    provider: local
    model: Qwen/Qwen2.5-0.5B-Instruct
    temperature: 0.0
    max_tokens: 256

suites:
  concurrency: 1
  security:
    poisoning: {targets: 10}
    injection: {targets: 10}
    disjoint_targets: true
    defenses: [none, prompt_isolation, injection_filter, answer_integrity]
