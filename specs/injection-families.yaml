# Step 05's measurement: does injection_filter defend, or does it recognise the
# two payloads it was written from? (docs/experiments/attack-defense-split.md)
#
# Security suite only, real generator, and enough injection targets that each
# template family gets a usable sample. The suite reports
# injection_compliance_rate@seen and @heldout separately; the gap between them
# is the part the combined rate hides.
name: injection-families
seed: 42

corpus:
  documents: datasets/seeded/corpus
  qa: datasets/seeded/qa.jsonl

ingest:
  filters: [dedup, language, boilerplate]
  chunker: {type: fixed, size_tokens: 350, overlap_tokens: 60}

index: {store: faiss, metric: cosine}

pipeline:
  embedder: {provider: local, model: sentence-transformers/all-MiniLM-L6-v2}
  retriever: {k: 20}
  reranker:
    provider: local
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    enabled: true
    top_n: 5
  generator:
    provider: local
    model: Qwen/Qwen2.5-0.5B-Instruct
    temperature: 0.0
    max_tokens: 256

suites:
  security:
    poisoning: {targets: 10}
    injection: {targets: 20}      # 10 seen + 10 held out
    defenses: [none, prompt_isolation, injection_filter]
    disjoint_targets: true        # step 04: keep the attacks from competing
    clean_control_sample: 20
