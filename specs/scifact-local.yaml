# Public-benchmark retrieval evaluation on BEIR SciFact (local provider).
# First run: python scripts/fetch_scifact.py   (downloads ~3 MB, never committed)
# SciFact has document-level gold labels and no short answers, so only the
# retrieval suite applies.
name: scifact-local
seed: 42

corpus:
  documents: datasets/scifact/corpus
  qa: datasets/scifact/qa.jsonl

ingest:
  filters: [dedup, boilerplate]   # no language filter: scientific text scores oddly
  chunker:
    type: fixed
    size_tokens: 350
    overlap_tokens: 60

index:
  store: faiss
  metric: cosine

pipeline:
  embedder:
    provider: local
    model: sentence-transformers/all-MiniLM-L6-v2
  retriever:
    k: 20
  reranker:
    provider: local
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    enabled: true
    top_n: 5
  generator:
    provider: local
    model: Qwen/Qwen2.5-0.5B-Instruct
    temperature: 0.0
    max_tokens: 256

suites:
  retrieval:
    k_values: [1, 5, 10, 20]
    rerank_lift: true
