# The spec `make demo` runs: fully local, zero keys.
# First run downloads ~1.2 GB of open models (MiniLM embedder, MiniLM
# cross-encoder, Qwen2.5-0.5B generator); everything after is offline.
name: demo-local-cohere
seed: 50

corpus:
  documents: datasets/scifact/corpus
  qa: datasets/scifact/qa.jsonl

ingest:
  filters: [dedup, language, boilerplate]
  chunker:
    type: fixed
    size_tokens: 500
    overlap_tokens: 70
  #reranker: True
    

index:
  store: faiss
  metric: cosine

pipeline:
  embedder:
    provider: local
    model: sentence-transformers/all-MiniLM-L6-v2
  retriever:
    k: 20
  reranker:
    provider: local
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    enabled: true
    top_n: 6
  generator:
    provider: local
    model: CohereLabs/North-Mini-Code-1.0
    temperature: 0.0
    max_tokens: 512

suites:
  retrieval:
    k_values: [1, 5, 10, 20]
    rerank_lift: true
  faithfulness:
    sample_size: 20            # keeps the CPU demo under ~5 minutes
    judge:
      kind: llm
      provider: local
      model: Qwen/Qwen2.5-0.5B-Instruct
      mode: auto               # committed cache hit = free + reproducible;
      cache: datasets/seeded/judgments.jsonl   # misses are judged + persisted
  security:
    poisoning: {targets: 10}   # 10 poison + 10 injection × 3 defenses on CPU
    injection: {targets: 10}
    defenses: [none, prompt_isolation, injection_filter]
  privacy:
    canaries: 9                # 9 canaries × 3 probes × 2 conditions on CPU
    kinds: [email, api_key, phone]
    probes: [direct, indirect, paraphrase]
    defenses: [none, pii_filter]
