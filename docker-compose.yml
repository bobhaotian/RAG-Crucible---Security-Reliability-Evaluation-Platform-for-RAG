# API + worker sharing one SQLite store, index directory, and worker-generated
# portable reports via a volume.
# Defaults to the fake-provider spec so `docker compose up` answers /query and
# completes submitted runs with zero downloads. To serve the local-model
# pipeline instead, build with WITH_LOCAL=1 and set RAG_CRUCIBLE_SERVE_SPEC.
#
# Qdrant (the server-backed vector store) is opt-in via a compose profile so the
# default stack stays single-container:
#   docker compose --profile qdrant up -d qdrant
services:
  api:
    build:
      context: .
      args:
        WITH_LOCAL: "${WITH_LOCAL:-0}"
    command:
      ["uv", "run", "--no-sync", "rag-crucible", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RAG_CRUCIBLE_SERVE_SPEC: ${RAG_CRUCIBLE_SERVE_SPEC:-specs/smoke-fake.yaml}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    ports:
      - "8000:8000"
    volumes:
      - rag-crucible-data:/data/artifacts

  worker:
    build:
      context: .
      args:
        WITH_LOCAL: "${WITH_LOCAL:-0}"
    command: ["uv", "run", "--no-sync", "rag-crucible", "worker"]
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    volumes:
      - rag-crucible-data:/data/artifacts

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "8080:80"
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:v1.12.1
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  rag-crucible-data:
  qdrant-data:
